# Fly.io config for the public API demo.
# One-time setup:
#   flyctl launch --no-deploy --copy-config --name sovereign-financial-analyst
#   flyctl secrets set GROQ_API_KEY=... SEC_API_KEY=...
# Deploy:
#   flyctl deploy --dockerfile Dockerfile --build-target api
# (the GitHub Actions workflow runs the same command on every push to main)

app = "sovereign-financial-analyst"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  build-target = "api"

[env]
  # Public demo runs on hosted inference (Groq) rather than Ollama -- a
  # public URL can't require visitors to run a local model. See app/llm.py.
  LLM_PROVIDER = "groq"
  GROQ_MODEL = "llama-3.1-8b-instant"
  CHROMA_PATH = "/srv/chroma_db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
