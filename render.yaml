services:
  - type: web
    name: sovereign-financial-analyst-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: CHROMA_PATH
        value: /srv/chroma_db
      - key: GROQ_API_KEY
        sync: false
      - key: SEC_API_KEY
        sync: false
